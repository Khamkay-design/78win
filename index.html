<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7878 Diamond Edition - Mobile</title>
    <!-- Tailwind CSS CDN สำหรับจัดสไตล์ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #030712;
        }
        .diamond-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.15);
        }
        .diamond-border {
            border-image: linear-gradient(to bottom right, rgba(255,215,0,0.8), rgba(255,255,255,0.2), rgba(212,175,55,0.4)) 1;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 m-0 sm:py-6">

    <!-- กรอบหน้าจอมือถือ (Mobile Container) -->
    <div class="mobile-container w-full sm:max-w-md bg-slate-950 text-slate-100 min-h-screen sm:min-h-[800px] relative overflow-hidden flex flex-col justify-between p-5 sm:rounded-3xl border sm:border-amber-200/40 shadow-2xl">
      
      <!-- แสงสะท้อนเพชรและคริสตัล (Background Glow) -->
      <div class="absolute -top-20 -left-20 w-56 h-56 bg-cyan-400/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute top-1/3 -right-20 w-56 h-56 bg-amber-200/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-20 left-1/4 w-56 h-56 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- ส่วนหัว (Header) -->
      <header class="flex justify-between items-center py-4 border-b border-amber-200/20 z-10">
        <div class="flex items-center space-x-2">
            <span class="text-amber-300 text-lg">💎</span>
            <span class="text-xs tracking-widest text-amber-200 font-semibold uppercase">7878 Diamond</span>
        </div>
        <div class="text-[10px] bg-gradient-to-r from-amber-200 to-amber-400 text-slate-950 px-2.5 py-1 rounded-full font-bold shadow-md">
            VIP EXCLUSIVE
        </div>
      </header>

      <!-- เนื้อหาหลัก (Main Content) -->
      <main class="flex-1 flex flex-col items-center justify-center text-center my-6 z-10">
        <!-- ไอคอนเพชรเรืองแสง -->
        <div class="w-28 h-28 mb-6 rounded-2xl bg-gradient-to-tr from-slate-900 via-cyan-950 to-slate-900 border border-amber-200/40 flex items-center justify-center diamond-glow relative group">
          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent opacity-50 animate-pulse"></div>
          <span class="text-5xl filter drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]">✨</span>
        </div>

        <!-- หัวข้อหลัก -->
        <h1 class="text-xl font-bold bg-gradient-to-r from-amber-100 via-amber-300 to-amber-500 bg-clip-text text-transparent mb-3 tracking-wide">
          LUXURY DIAMOND EXPERIENCE
        </h1>
        <p class="text-xs text-slate-300 px-6 leading-relaxed">
          ยبرะดับประสบการณ์การใช้งานของคุณให้หรูหราและเปล่งประกายดั่งเพชรแท้ในทุกมุมมอง
        </p>

        <!-- การ์ดจำลองข้อมูลสไตล์คริสตัล -->
        <div class="w-full mt-6 p-4 rounded-2xl bg-slate-900/60 border border-amber-200/20 backdrop-blur-md text-left">
            <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                <span>สถานะระบบ</span>
                <span class="text-emerald-400 font-medium">● พร้อมใช้งาน</span>
            </div>
            <div class="flex justify-between items-center text-sm font-semibold text-amber-100">
                <span>ระดับสมาชิก</span>
                <span class="text-amber-300">Diamond VIP</span>
            </div>
        </div>
      </main>

      <!-- ส่วนท้าย / ปุ่มดำเนินการ (Action Button) -->
      <footer class="z-10 pb-4 pt-2">
        <button class="w-full py-3.5 bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 text-slate-950 font-bold text-sm rounded-xl shadow-[0_0_20px_rgba(255,215,0,0.3)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-200">
          เข้าสู่ระบบ / เริ่มต้นใช้งาน
        </button>
        <p class="text-[10px] text-center text-slate-500 mt-3">
          © 2026 7878 Diamond Edition. All rights reserved.
        </p>
      </footer>

    </div>

</body>
</html>
